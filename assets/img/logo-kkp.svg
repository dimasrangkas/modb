  </defs>

  <!-- cakram laut -->
  <circle cx="32" cy="32" r="30" fill="url(#kkpSea)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#003A66" stroke-width="2"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".55"/>

  <!-- bintang -->
  <path d="M32 9.5l1.9 4.1 4.5.5-3.4 3 1 4.4-4-2.3-4 2.3 1-4.4-3.4-3 4.5-.5z" fill="#F5C048"/>

  <!-- ikan -->
