<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Resource Management — dermaga, peralatan bongkar muat, gudang dan lapangan penumpukan.">
<title>Resources · PMS Port Management System</title>

<link rel="icon" href="assets/img/logo-kkp.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Urutan pemuatan CSS penting: responsive.css harus terakhir. -->
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body data-page="resources">
<div class="app">
  <header class="topbar" id="topbar"></header>
  <nav class="sidebar" id="sidebar" aria-label="Navigasi utama"></nav>

  <main class="main">
    <section class="page">

      <div class="page-head">
        <div>
          <h1>Resource Management</h1>
          <div class="sub">Dermaga, peralatan bongkar muat, terminal dan kapasitas lapangan penumpukan</div>
        </div>
      </div>

      <div class="section-label">Tata Letak &amp; Okupansi Dermaga</div>
      <div class="card" style="padding:20px;">
        <div class="berth-grid" id="berthGrid"></div>
      </div>

      <div class="section-label">Utilisasi Peralatan &amp; Armada</div>
      <div class="grid-2">
        <div class="card res-list-card"><h2>Container Crane &amp; RTG</h2><div id="craneList"></div></div>
        <div class="card res-list-card"><h2>Kapal Tunda &amp; Kapal Pandu</h2><div id="tugList"></div></div>
      </div>

      <div class="section-label">Kapasitas Terminal</div>
      <div class="grid-3">
        <div class="card side-card"><h2>Gudang</h2><div id="warehouseList"></div></div>

        <div class="card side-card">
          <h2>Lapangan Penumpukan (TEU)</h2>
          <div class="big-stat" id="yardStat"></div>
          <div class="bar-track" style="margin-top:8px;"><div class="bar-fill" id="yardBar" style="background:var(--primary);"></div></div>
          <div class="yard-grid" id="yardGrid"></div>
          <div class="card-note" id="yardNote"></div>
        </div>

        <div class="card side-card">
          <h2>Terminal Penumpang &amp; Alat Bantu</h2>
          <div class="big-stat" id="paxStat"></div>
          <div class="bar-track" style="margin-top:8px;margin-bottom:14px;"><div class="bar-fill" id="paxBar" style="background:var(--accent);"></div></div>
          <div id="equipmentList"></div>
        </div>
      </div>

    </section>
  </main>
</div>

<script src="assets/js/utils.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/copilot.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
