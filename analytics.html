<body data-page="analytics">
<div class="app">
  <header class="topbar" id="topbar"></header>
  <nav class="sidebar" id="sidebar" aria-label="Navigasi utama"></nav>

  <main class="main">
    <section class="page">

        </div>
      </div>

      <div class="card ai-panel" style="margin-bottom:22px;">

          <div class="ai-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><path d="M12 2l1.8 5.5L19 9l-5.2 1.5L12 16l-1.8-5.5L5 9l5.2-1.5z"/></svg></div>

        </div>
        <div id="aiInsights"></div>
      </div>

      <div class="analytics-grid" id="analyticsGrid"></div>

      <div class="section-label">Heatmap Okupansi Dermaga</div>
      <div class="card" style="padding:20px;overflow-x:auto;">
        <div class="heat-hours" id="heatHours"></div>
        <div id="heatBody"></div>
      </div>

    </section>
  </main>
</div>
