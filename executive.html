<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Executive Dashboard — ikhtisar kinerja strategis pelabuhan bulanan.">
<title>Executive · PMS Port Management System</title>

<link rel="icon" href="assets/img/logo-kkp.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Urutan pemuatan CSS penting: responsive.css harus terakhir. -->
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body data-page="executive">
<div class="app">
  <header class="topbar" id="topbar"></header>
  <nav class="sidebar" id="sidebar" aria-label="Navigasi utama"></nav>

  <main class="main">
    <section class="page">

      <div class="page-head">
        <div>
          <h1>Executive Dashboard</h1>
          <div class="sub" id="execSub"></div>
        </div>
      </div>

      <div class="kpi-grid" id="execKpiGrid" style="grid-template-columns:repeat(3,1fr);"></div>

      <div class="section-label">Kinerja Bulanan</div>
      <div class="card chart-card">
        <h3>Pendapatan vs. Kunjungan Kapal — 12 Bulan Terakhir</h3>
        <div class="sub">Indeks komposit, dinormalisasi terhadap periode dasar</div>
        <canvas id="execChart" height="90"></canvas>
      </div>

      <div class="section-label">Ringkasan Eksekutif</div>
      <div class="card side-card">
        <div id="execSummary" style="font-size:13px;line-height:1.8;color:var(--text-mid);"></div>
      </div>

    </section>
  </main>
</div>

<!-- Chart.js hanya dimuat di halaman yang benar-benar memakai grafik. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/copilot.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
